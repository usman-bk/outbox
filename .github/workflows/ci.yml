name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outbox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - run: go build ./...
      - run: go vet ./...
      - name: Formatting
        run: |
          u=$(gofmt -l .)
          if [ -n "$u" ]; then echo "gofmt would change:"; echo "$u"; exit 1; fi

      - name: Test with nothing external
        run: go test -race ./...

      - name: Test against Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/outbox_test?sslmode=disable
        run: go test -race ./...

      # Four relays over two hundred messages, several times. A
      # concurrency property that holds once is not a property.
      - name: Hammer the concurrent relays
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/outbox_test?sslmode=disable
        run: go test -race -count=10 ./internal/relay/ -run TestTwoRelays
